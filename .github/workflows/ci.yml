name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.crate }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination's failures, not just the first to fail.
      fail-fast: false
      matrix:
        # These are three independent crates, not a Cargo workspace —
        # each needs its own cargo invocation and its own cache.
        # fill_db does the path handling, mbox I/O and charset decoding, so
        # only it is worth the cost of a full three-OS sweep; the other two
        # stay on Linux.
        include:
          - { crate: gmail-mbox-parser, os: ubuntu-latest }
          - { crate: gmail-mbox-parser, os: macos-latest }
          - { crate: gmail-mbox-parser, os: windows-latest }
          - { crate: gmail-mbox-parser/tools, os: ubuntu-latest }
          - { crate: calendar-parser, os: ubuntu-latest }
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rusqlite's `bundled` feature compiles SQLite from C source:
      # minutes when cold, seconds when cached.
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-crate/per-OS cache key to avoid cross-crate cache pollution.
          key: ${{ matrix.crate }}-${{ matrix.os }}
          workspaces: ${{ matrix.crate }}
          # Save cache even on failure for faster iteration on red builds.
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gmail-contact-graph/webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gmail-contact-graph/webapp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` runs tsc in every package, so this is also the typecheck.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

[package]
name = "fast_mbox_parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "fast_mbox_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
memmap2 = "0.9"
charset = "0.1"
base64 = "0.22"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[[bin]]
name = "fill_db"
path = "src/bin/fill_db.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

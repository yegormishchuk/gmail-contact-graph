[package]
name = "fast_mbox_parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "fast_mbox_parser"
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }
rayon = "1.10"
memmap2 = "0.9"
charset = "0.1"
base64 = "0.22"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

[features]
default = []
python = ["pyo3"]

[[bin]]
name = "fill_db"
path = "src/bin/fill_db/main.rs"

[[bin]]
name = "verify_contacts"
path = "src/bin/verify_contacts/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "calendar-parser"
version = "0.1.0"
edition = "2021"
# This crate's own dependency graph only needs 1.71, but it is documented and
# tested as one pipeline with gmail-mbox-parser, so it declares the same floor.
rust-version = "1.87"
description = "Google Calendar .ics parser → SQLite events table"
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

[[bin]]
name = "fill_events"
path = "src/bin/fill_events/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "ranking_tools"
version = "0.2.1"
edition = "2021"
# Only needs 1.65 on its own, but `make process-all` builds it alongside
# fill_db, so it declares the same floor as the parser it ships with.
rust-version = "1.87"
license = "Apache-2.0"

[[bin]]
name = "generate_rankings"
path = "src/generate_rankings.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

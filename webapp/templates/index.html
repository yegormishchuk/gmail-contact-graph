<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Contact Graph</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gmail Contact Graph</h1>
            <div class="stats">
                <div class="stat-item">
                    <span>Total contacts:</span>
                    <span class="stat-value" id="total-contacts">-</span>
                </div>
                <div class="stat-item">
                    <span>Displayed:</span>
                    <span class="stat-value" id="displayed-contacts">-</span>
                </div>
                <div class="stat-item">
                    <span>Emails received:</span>
                    <span class="stat-value" id="total-received">-</span>
                </div>
                <div class="stat-item">
                    <span>Emails sent:</span>
                    <span class="stat-value" id="total-sent">-</span>
                </div>
            </div>
        </header>

        <div id="graph-container">
            <div class="loading" id="loading">Loading graph...</div>
            <svg id="graph"></svg>

            <div class="ranking-panel" id="ranking-panel">
                <div class="ranking-header">
                    <div class="ranking-tabs">
                        <button class="ranking-tab active" data-tab="ranking">Ranking</button>
                        <button class="ranking-tab" data-tab="spam">Spam</button>
                    </div>
                    <button class="ranking-toggle" id="ranking-toggle" title="Hide panel">−</button>
                </div>
                <input type="text" class="ranking-search" id="ranking-search" placeholder="Search...">
                <div class="ranking-list" id="ranking-list"></div>
                <div class="ranking-list hidden" id="spam-list"></div>
            </div>
            <button class="ranking-show-btn hidden" id="ranking-show-btn" title="Show ranking">☰</button>

            <div class="tooltip" id="tooltip">
                <button class="tooltip-close" id="tooltip-close">&times;</button>
                <div class="tooltip-name"></div>
                <div class="tooltip-email"></div>
                <div class="tooltip-org"></div>
                <div class="tooltip-groups"></div>
                <div class="tooltip-stats">
                    <div class="tooltip-stat">
                        <span class="tooltip-stat-label">Received</span>
                        <span class="tooltip-stat-value received"></span>
                    </div>
                    <div class="tooltip-stat">
                        <span class="tooltip-stat-label">Sent</span>
                        <span class="tooltip-stat-value sent"></span>
                    </div>
                </div>
                <div class="tooltip-buttons">
                    <button class="mark-human-btn" id="mark-human-btn">It's a human</button>
                    <button class="mark-not-human-btn" id="mark-not-human-btn">Not a human</button>
                </div>
            </div>

            <div class="legend">
                <div class="legend-title">Legend</div>
                <div class="legend-item">
                    <div class="legend-color received"></div>
                    <span>Emails received</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color sent"></div>
                    <span>Emails sent</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color border-indicator"></div>
                    <span>Has outgoing emails</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color domain-indicator"></div>
                    <span>Same organization</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color group-indicator"></div>
                    <span>Message group</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color unclear-indicator"></div>
                    <span>May not be a person</span>
                </div>
            </div>

            <div class="controls">
                <div class="controls-title">Filters</div>

                <div class="search-group">
                    <input type="text" id="contact-search" placeholder="Search by name or email..." autocomplete="off">
                    <div class="search-results" id="search-results"></div>
                </div>

                <div class="control-group">
                    <label class="control-label received">
                        <input type="checkbox" id="show-senders" checked>
                        Show senders
                    </label>
                    <label class="control-label sent">
                        <input type="checkbox" id="show-recipients" checked>
                        Show recipients
                    </label>
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Contact limit:</span>
                        <span class="slider-value" id="limit-value">50</span>
                    </div>
                    <input type="range" id="contact-limit" min="10" max="500" value="50" step="10">
                </div>

                <button class="control-btn" id="reset-zoom">Reset zoom</button>
            </div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

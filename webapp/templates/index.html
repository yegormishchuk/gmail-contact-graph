<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Contact Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #888;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            color: #4fc3f7;
            font-weight: 600;
        }

        #graph-container {
            flex: 1;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* Node styles */
        .node-center {
            fill: #ff6b6b;
            stroke: #fff;
            stroke-width: 3px;
            filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.5));
        }

        .node-contact {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 1.5px;
        }

        .node-contact:hover {
            stroke: #fff;
            stroke-width: 2px;
        }

        /* Link styles */
        .link {
            stroke-opacity: 0.6;
        }

        .link-received {
            stroke: #4fc3f7;
        }

        .link-sent {
            stroke: #81c784;
        }

        /* Labels */
        .label {
            font-size: 11px;
            fill: #fff;
            pointer-events: none;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
        }

        .label-center {
            font-size: 14px;
            font-weight: 600;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 300px;
            z-index: 1000;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #fff;
        }

        .tooltip-email {
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .tooltip-stats {
            display: flex;
            gap: 20px;
        }

        .tooltip-stat {
            display: flex;
            flex-direction: column;
        }

        .tooltip-stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        .tooltip-stat-value {
            font-size: 16px;
            font-weight: 600;
        }

        .tooltip-stat-value.received {
            color: #4fc3f7;
        }

        .tooltip-stat-value.sent {
            color: #81c784;
        }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
        }

        .legend-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .legend-color {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-color.received {
            background: #4fc3f7;
        }

        .legend-color.sent {
            background: #81c784;
        }

        /* Controls */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gmail Contact Graph</h1>
            <div class="stats">
                <div class="stat-item">
                    <span>Всего контактов:</span>
                    <span class="stat-value" id="total-contacts">-</span>
                </div>
                <div class="stat-item">
                    <span>Показано:</span>
                    <span class="stat-value" id="displayed-contacts">-</span>
                </div>
                <div class="stat-item">
                    <span>Получено писем:</span>
                    <span class="stat-value" id="total-received">-</span>
                </div>
                <div class="stat-item">
                    <span>Отправлено писем:</span>
                    <span class="stat-value" id="total-sent">-</span>
                </div>
            </div>
        </header>

        <div id="graph-container">
            <div class="loading" id="loading">Загрузка графа...</div>
            <svg id="graph"></svg>

            <div class="tooltip" id="tooltip">
                <div class="tooltip-name"></div>
                <div class="tooltip-email"></div>
                <div class="tooltip-stats">
                    <div class="tooltip-stat">
                        <span class="tooltip-stat-label">Получено</span>
                        <span class="tooltip-stat-value received"></span>
                    </div>
                    <div class="tooltip-stat">
                        <span class="tooltip-stat-label">Отправлено</span>
                        <span class="tooltip-stat-value sent"></span>
                    </div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-title">Направление писем</div>
                <div class="legend-item">
                    <div class="legend-color received"></div>
                    <span>Получено от контакта</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color sent"></div>
                    <span>Отправлено контакту</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="reset-zoom">Сбросить масштаб</button>
            </div>
        </div>
    </div>

    <script>
        // Graph configuration
        const config = {
            centerNodeRadius: 40,
            minNodeRadius: 8,
            maxNodeRadius: 35,
            linkWidth: 2,
            chargeStrength: -300,
            minLinkDistance: 80,
            maxLinkDistance: 300
        };

        // Color scale for nodes based on activity type
        function getNodeColor(d) {
            if (d.isCenter) return '#ff6b6b';

            const total = d.received + d.sent;
            const sentRatio = d.sent / (total || 1);

            // Interpolate between received color (blue) and sent color (green)
            const receivedColor = d3.rgb(79, 195, 247);
            const sentColor = d3.rgb(129, 199, 132);

            return d3.interpolateRgb(receivedColor, sentColor)(sentRatio);
        }

        // Track if already initialized
        let isInitialized = false;
        let currentSimulation = null;

        // Main graph rendering
        async function renderGraph() {
            // Prevent duplicate initialization
            if (isInitialized) return;
            isInitialized = true;

            try {
                const response = await fetch('/api/graph');
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                // Update stats
                document.getElementById('total-contacts').textContent = data.stats.totalContacts.toLocaleString();
                document.getElementById('displayed-contacts').textContent = data.stats.displayedContacts;
                document.getElementById('total-received').textContent = data.stats.totalReceived.toLocaleString();
                document.getElementById('total-sent').textContent = data.stats.totalSent.toLocaleString();

                const container = document.getElementById('graph-container');
                const width = container.clientWidth;
                const height = container.clientHeight;

                // Create scale for node radius
                const maxActivity = d3.max(data.nodes, d => d.received + d.sent) || 1;
                const radiusScale = d3.scaleSqrt()
                    .domain([0, maxActivity])
                    .range([config.minNodeRadius, config.maxNodeRadius]);

                // Create scale for link distance (more emails = closer = shorter distance)
                const maxLinkCount = d3.max(data.links, d => d.count) || 1;
                const linkDistanceScale = d3.scaleLog()
                    .domain([1, maxLinkCount])
                    .range([config.maxLinkDistance, config.minLinkDistance]);

                // Clear SVG
                const svg = d3.select('#graph');
                svg.selectAll('*').remove();
                svg.attr('width', width).attr('height', height);

                // Add zoom behavior
                const g = svg.append('g');

                const zoom = d3.zoom()
                    .scaleExtent([0.2, 4])
                    .on('zoom', (event) => {
                        g.attr('transform', event.transform);
                    });

                svg.call(zoom);

                // Reset zoom button
                document.getElementById('reset-zoom').onclick = () => {
                    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
                };

                // Create arrow markers for directed links
                const defs = svg.append('defs');

                defs.append('marker')
                    .attr('id', 'arrow-received')
                    .attr('viewBox', '0 -5 10 10')
                    .attr('refX', 20)
                    .attr('refY', 0)
                    .attr('markerWidth', 6)
                    .attr('markerHeight', 6)
                    .attr('orient', 'auto')
                    .append('path')
                    .attr('d', 'M0,-5L10,0L0,5')
                    .attr('fill', '#4fc3f7');

                defs.append('marker')
                    .attr('id', 'arrow-sent')
                    .attr('viewBox', '0 -5 10 10')
                    .attr('refX', 20)
                    .attr('refY', 0)
                    .attr('markerWidth', 6)
                    .attr('markerHeight', 6)
                    .attr('orient', 'auto')
                    .append('path')
                    .attr('d', 'M0,-5L10,0L0,5')
                    .attr('fill', '#81c784');

                // Create force simulation with distance based on email count
                currentSimulation = d3.forceSimulation(data.nodes)
                    .force('link', d3.forceLink(data.links)
                        .id(d => d.id)
                        .distance(d => linkDistanceScale(d.count)))
                    .force('charge', d3.forceManyBody()
                        .strength(config.chargeStrength))
                    .force('center', d3.forceCenter(width / 2, height / 2))
                    .force('collision', d3.forceCollide()
                        .radius(d => (d.isCenter ? config.centerNodeRadius : radiusScale(d.received + d.sent)) + 10));

                // Create links with uniform width
                const link = g.append('g')
                    .attr('class', 'links')
                    .selectAll('line')
                    .data(data.links)
                    .enter()
                    .append('line')
                    .attr('class', d => `link link-${d.type}`)
                    .attr('stroke-width', config.linkWidth)
                    .attr('marker-end', d => `url(#arrow-${d.type})`);

                // Create nodes
                const node = g.append('g')
                    .attr('class', 'nodes')
                    .selectAll('circle')
                    .data(data.nodes)
                    .enter()
                    .append('circle')
                    .attr('class', d => d.isCenter ? 'node-center' : 'node-contact')
                    .attr('r', d => d.isCenter ? config.centerNodeRadius : radiusScale(d.received + d.sent))
                    .attr('fill', getNodeColor)
                    .call(d3.drag()
                        .on('start', dragstarted)
                        .on('drag', dragged)
                        .on('end', dragended));

                // Create labels
                const label = g.append('g')
                    .attr('class', 'labels')
                    .selectAll('text')
                    .data(data.nodes)
                    .enter()
                    .append('text')
                    .attr('class', d => d.isCenter ? 'label label-center' : 'label')
                    .attr('text-anchor', 'middle')
                    .attr('dy', d => d.isCenter ? config.centerNodeRadius + 15 : radiusScale(d.received + d.sent) + 12)
                    .text(d => d.name.length > 20 ? d.name.substring(0, 17) + '...' : d.name);

                // Tooltip
                const tooltip = d3.select('#tooltip');

                node.on('mouseover', (event, d) => {
                    if (d.isCenter) return;

                    tooltip.select('.tooltip-name').text(d.name);
                    tooltip.select('.tooltip-email').text(d.email);
                    tooltip.select('.tooltip-stat-value.received').text(d.received.toLocaleString());
                    tooltip.select('.tooltip-stat-value.sent').text(d.sent.toLocaleString());

                    tooltip
                        .style('left', (event.pageX + 15) + 'px')
                        .style('top', (event.pageY - 10) + 'px')
                        .classed('visible', true);
                })
                .on('mousemove', (event) => {
                    tooltip
                        .style('left', (event.pageX + 15) + 'px')
                        .style('top', (event.pageY - 10) + 'px');
                })
                .on('mouseout', () => {
                    tooltip.classed('visible', false);
                });

                // Update positions on tick
                currentSimulation.on('tick', () => {
                    link
                        .attr('x1', d => d.source.x)
                        .attr('y1', d => d.source.y)
                        .attr('x2', d => d.target.x)
                        .attr('y2', d => d.target.y);

                    node
                        .attr('cx', d => d.x)
                        .attr('cy', d => d.y);

                    label
                        .attr('x', d => d.x)
                        .attr('y', d => d.y);
                });

                // Drag functions
                function dragstarted(event, d) {
                    if (!event.active) currentSimulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                }

                function dragged(event, d) {
                    d.fx = event.x;
                    d.fy = event.y;
                }

                function dragended(event, d) {
                    if (!event.active) currentSimulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }

            } catch (error) {
                document.getElementById('loading').textContent = 'Ошибка загрузки: ' + error.message;
                console.error('Error loading graph:', error);
            }
        }

        // Initialize once
        renderGraph();
    </script>
</body>
</html>

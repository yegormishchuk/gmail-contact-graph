<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Contact Graph</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gmail Contact Graph</h1>
            <div class="stats">
                <div class="stat-item">
                    <span>Всего контактов:</span>
                    <span class="stat-value" id="total-contacts">-</span>
                </div>
                <div class="stat-item">
                    <span>Показано:</span>
                    <span class="stat-value" id="displayed-contacts">-</span>
                </div>
                <div class="stat-item">
                    <span>Получено писем:</span>
                    <span class="stat-value" id="total-received">-</span>
                </div>
                <div class="stat-item">
                    <span>Отправлено писем:</span>
                    <span class="stat-value" id="total-sent">-</span>
                </div>
            </div>
        </header>

        <div id="graph-container">
            <div class="loading" id="loading">Загрузка графа...</div>
            <svg id="graph"></svg>

            <div class="tooltip" id="tooltip">
                <div class="tooltip-name"></div>
                <div class="tooltip-email"></div>
                <div class="tooltip-stats">
                    <div class="tooltip-stat">
                        <span class="tooltip-stat-label">Получено</span>
                        <span class="tooltip-stat-value received"></span>
                    </div>
                    <div class="tooltip-stat">
                        <span class="tooltip-stat-label">Отправлено</span>
                        <span class="tooltip-stat-value sent"></span>
                    </div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-title">Направление писем</div>
                <div class="legend-item">
                    <div class="legend-color received"></div>
                    <span>Получено от контакта</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color sent"></div>
                    <span>Отправлено контакту</span>
                </div>
            </div>

            <div class="controls">
                <div class="controls-title">Фильтры</div>

                <div class="control-group">
                    <label class="control-label received">
                        <input type="checkbox" id="show-senders" checked>
                        Показать отправителей
                    </label>
                    <label class="control-label sent">
                        <input type="checkbox" id="show-recipients" checked>
                        Показать получателей
                    </label>
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Лимит контактов:</span>
                        <span class="slider-value" id="limit-value">50</span>
                    </div>
                    <input type="range" id="contact-limit" min="10" max="500" value="50" step="10">
                </div>

                <button class="control-btn" id="reset-zoom">Сбросить масштаб</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/graph.js') }}"></script>
</body>
</html>
